name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
        # the suite split by marker (tests/conftest.py): unit = everything that does not render a demo; e2e = render /
        # mix / encode / QC of the demo projects. Both run in parallel on pytest-xdist (-n auto, demo builds shared)
        suite: [unit, e2e]
    name: ${{ matrix.os }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install engine (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "engine[test,motion]"
      - name: Chromium for the motion layer (playwright)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
      - name: Face-detection model (YuNet, sha-checked)
        run: |
          python - <<'PY'
          import hashlib, os, urllib.request
          d = os.path.join(os.path.expanduser("~"), ".cves", "models"); os.makedirs(d, exist_ok=True)
          p = os.path.join(d, "face_detection_yunet_2023mar.onnx")
          url = "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          urllib.request.urlretrieve(url, p)
          h = hashlib.sha256(open(p, "rb").read()).hexdigest()
          assert h == "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4", h
          print("yunet ok", p)
          PY
      - name: Lint (portability + no hard-coded style)
        if: matrix.suite == 'unit'
        run: python tools/lint.py && python tools/gate_status.py --check
      - name: Tests (${{ matrix.suite }}, pytest-xdist)
        run: |
          if [ "${{ matrix.suite }}" = "unit" ]; then M="not e2e"; else M="e2e"; fi
          python -m pytest -q -n auto --dist loadgroup -m "$M" --durations=15 -o faulthandler_timeout=600 tests
      - name: Control-mode export self-test
        if: matrix.suite == 'unit'
        run: cves export selftest --no-gui
