[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cves"
version = "0.4.0"
description = "Claude Video Editing System: edit.yaml-driven talking-head ad editor with automated QC"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python", "av", "pillow", "soundfile", "scipy", "librosa", "pyyaml", "torch", "opentimelineio"]

[project.scripts]
cves = "cves.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cves*"]

[tool.setuptools.package-data]
cves = ["styles/*.yaml", "styles/*.md", "motion/*.js", "motion/*.css", "motion/pieces/*/*"]   # styles/ includes platforms.yaml and viral.yaml

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-xdist==3.8.0", "filelock"]     # `python -m pytest -n auto tests` (CONTRIBUTING.md "Tests")
motion = ["playwright==1.58.0"]     # HTML motion pieces (docs/MOTION.md); then `python -m playwright install chromium`
