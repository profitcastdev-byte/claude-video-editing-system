# Treatment "minimal": restraint. Straight cuts, one clean caption line with the spoken word lit, gentle reframes, fewer
# graphics (the most informative ones stay), no flourishes behind the speaker, a neutral grade and a low bed. docs/TREATMENTS.md.
name: minimal
label: Minimal
summary: Quiet and clean. Straight cuts, one clean caption line, gentle reframes, only the graphics that carry information, a neutral grade.
style:
  captions:
    style: highlight
    highlight_mode: text
    size: 46
    max_chars: 30
    max_lines: 1
    case: sentence
    outline: 0
    emphasis: {scale: 1.0, numbers: false}
  transitions: {in: cut, out: cut}
  stage: {dots: false, glow: false}
  framing: {creep: 0.0, zoom_levels: [1.0, 1.16]}
  grade: {vignette: 0.0, shoulder: 0.1}
  motion: {energy: 0.4, entry_s: 0.32, ease: quint, drift: 0.0}
  sound: {bed_lu: -13, sfx_offset_db: -6, transition_sfx: {whip: null, glitch: null, cut: null, fade: null}}
  music: {sync: drop}
  rhythm: {music_energy: flat}
structure:
  pace: medium
  max_shot_s: null
  min_shot_s: null
  cutaways_per_30s: 2         # keeps the cutaways that carry a number or a list, then the longest
  punch_ins: gentle
  transitions: cut
  roto: drop
  music: {bed_lu_offset: -3}
  motion: {swap: {}}
  broll_move: null
