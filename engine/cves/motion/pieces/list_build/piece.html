<div class="safe center">
  <div class="list" id="list">
    <h2 class="title" id="tt"></h2>
  </div>
</div>
<style>
  .list { width: min(calc(100% - var(--u) * 18), calc(var(--u) * 84));   /* room for the 9u slide-in on both sides (PLAT-01) */ display: flex; flex-direction: column; gap: calc(var(--u) * 1.8); font-size: var(--t-4); text-align: left; }
  #tt { font-size: var(--t-5); margin-bottom: var(--s-2); text-align: left; }
  .row { display: flex; align-items: center; gap: calc(var(--u) * 2.6); padding: calc(var(--u) * 2.4) calc(var(--u) * 3);
         border-radius: var(--r); }
  .mk { width: 1.55em; height: 1.55em; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--accent);
        background: rgb(var(--accent-rgb) / 0.16); border: max(1px, calc(var(--u) * 0.14)) solid rgb(var(--accent-rgb) / 0.5); font-weight: 800; font-size: 0.82em; }
  .mk svg { width: 86%; height: 86%; }
  .mk.cross { color: var(--negative); background: rgb(var(--negative-rgb) / 0.14); border-color: rgb(var(--negative-rgb) / 0.45); }
  .mk.dot::after { content: ""; width: 34%; height: 34%; border-radius: 50%; background: currentColor; }
  .txt { display: flex; flex-direction: column; gap: 0.18em; min-width: 0; }
  .txt b { font-weight: 700; line-height: 1.12; }
  .txt small { font-size: 0.62em; font-weight: 500; color: var(--muted); line-height: 1.25; }
  .row.cross .txt b { color: var(--muted); }
  .row.lit { box-shadow: 0 calc(var(--u) * 2.2) calc(var(--u) * 6) rgb(0 0 0 / 0.38), inset 0 0 0 max(1px, calc(var(--u) * 0.14)) rgb(var(--accent-rgb) / var(--lit, 0)); }
</style>
<script>
(() => {
  const C = CVES, D = C.D; let list, tt, rows = [], tl;
  C.piece({
    setup(P, ctx) {
      list = document.getElementById('list'); tt = document.getElementById('tt');
      if (P.title) { C.words(tt, P.title); } else tt.remove();
      const items = (P.items || []).map((x) => (typeof x === 'string' ? { text: x } : x));
      const t0 = P.title ? D(0.35) : D(0.05), st = D(P.stagger || 0.38);
      items.forEach((it, i) => {
        const r = C.el('div', 'row glass lit', list), state = it.state || P.mark || 'check';
        const mk = C.el('div', 'mk ' + state, r);
        let path = null;
        if (state === 'check' || state === 'cross') { path = C.svg(mk, state === 'check' ? C.CHECK : C.CROSS).querySelector('path'); mk.dataset.el = 'mk'; }   // its own part: the pop sound sits on its logged entry (SND-07)
        else if (state === 'number') mk.textContent = String(i + 1);
        if (state === 'cross' && items.some((y) => (y.state || P.mark || 'check') !== 'cross')) r.classList.add('cross');   // mute crosses only beside checks
        const tx = C.el('div', 'txt', r); const b = C.el('b', '', tx, C.plain(it.text)); r.dataset.text = C.plain(it.text) + (it.sub ? ' ' + C.plain(it.sub) : '');
        if (it.sub) C.el('small', '', tx, C.plain(it.sub));
        rows.push({ r, mk, path, at: typeof it.at === 'number' ? it.at : t0 + i * st });
      });
      // shrink the whole list until it fits the safe zone
      const maxH = list.parentElement.clientHeight * 0.98; let fs = parseFloat(getComputedStyle(list).fontSize);
      for (let k = 0; k < 30 && list.getBoundingClientRect().height > maxH; k++) { fs *= 0.94; list.style.fontSize = fs + 'px'; }
      tl = C.timeline().at('tt', 0, D(0.6));
    },
    seek(t, P, ctx) {
      const u = ctx.u, ex = C.exitP(t);
      if (tt.isConnected) tt.querySelectorAll('.wi').forEach((wi, i) => C.rise(wi, t, i * D(0.04), D(0.6), wi.offsetHeight));
      let lit = -1; rows.forEach((x, i) => { if (t >= x.at) lit = i; });
      rows.forEach((x, i) => {
        const p = C.rise(x.r, t, x.at, D(0.62), 9 * u, { axis: 'x', fade: 3 });
        const pop = x.at + D(0.22), pm = C.prog(t, pop, D(0.42));
        // a check / cross mark pops in with its stroke, on the frame of its pop cue; a number / dot well arrives with the row
        C.set(x.mk, { s: 0.5 + 0.5 * C.easings.outBack(C.prog(t, x.path ? pop : x.at + D(0.1), D(0.4))), o: (x.path ? t >= pop : p > 0) ? 1 : 0 });
        if (x.path) C.draw(x.path, C.easings.outCubic(pm));
        const glow = i === lit ? C.prog(t, x.at + D(0.2), D(0.3)) : Math.max(0, 1 - C.prog(t, (rows[i + 1] || {}).at || 1e9, D(0.3)));
        x.r.style.setProperty('--lit', (0.55 * glow).toFixed(3));
        if (ex) C.set(x.r, { x: -ex * 4 * u, o: 1 - ex });
      });
      if (ex && tt.isConnected) C.set(tt, { o: 1 - ex });
    },
    cues() {
      rows.forEach((x, i) => {
        C.cue(x.at, 'card', -16, { pitch: [0, 0.5, -0.5, 1][i % 4] });
        if (x.path) C.cue(x.at + D(0.22), 'pop', x.mk.classList.contains('cross') ? -19 : -17, { pitch: (x.mk.classList.contains('cross') ? -2 : 2) + (i % 3) * 0.4 });
      });
    },
  });
})();
</script>
