<div class="safe center" id="root">
  <h2 class="title" id="tt"></h2>
  <div class="grid" id="grid"></div>
</div>
<style>
  #root { gap: var(--s-5); }
  #tt { font-size: var(--t-6); text-align: center; }
  .grid { width: min(100%, calc(var(--u) * 86)); display: flex; flex-direction: column; gap: calc(var(--u) * 2.6); }
  .cd { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 2.6); border-radius: var(--r); text-align: left; }
  .md { flex: none; width: calc(var(--u) * 20); height: calc(var(--u) * 20); border-radius: calc(var(--r) * 0.75); overflow: hidden; display: grid; place-items: center;
        background: rgb(var(--accent-rgb) / 0.16); color: var(--accent); font-weight: 800; font-size: var(--t-6); }
  .md .ic { font-size: calc(var(--u) * 8); }
  .md .ph { width: 100%; height: 100%; background-size: cover; background-position: center; }
  .tx { display: flex; flex-direction: column; gap: 0.3em; min-width: 0; }
  .tx b { font-size: var(--t-5); font-weight: 700; line-height: 1.08; }
  .tx small { font-size: var(--t-3); font-weight: 500; color: var(--muted); line-height: 1.3; }
  .cd { --lit: 0; box-shadow: 0 calc(var(--u) * 2.2) calc(var(--u) * 6) rgb(0 0 0 / 0.38), inset 0 0 0 max(1px, calc(var(--u) * 0.18)) rgb(var(--accent-rgb) / var(--lit)); }
  @media (min-aspect-ratio: 1/1) {
    .grid { width: min(100%, calc(var(--u) * 160)); flex-direction: row; align-items: stretch; gap: calc(var(--u) * 3); }
    .cd { flex: 1; flex-direction: column; align-items: flex-start; padding: calc(var(--u) * 2.4); gap: calc(var(--u) * 2.4); }
    .md { width: 100%; height: auto; aspect-ratio: 16 / 10; }
    .md.small { width: calc(var(--u) * 13); height: calc(var(--u) * 13); aspect-ratio: auto; }
    .tx { padding: 0 calc(var(--u) * 0.6) calc(var(--u) * 0.6); }
    .tx b { font-size: var(--t-4); } .tx small { font-size: var(--t-2); }
  }
</style>
<script>
(() => {
  const C = CVES, D = C.D; let tt, grid, cards = [], tl, hi;
  C.piece({
    setup(P, ctx) {
      tt = document.getElementById('tt'); grid = document.getElementById('grid');
      if (P.title) C.words(tt, P.title); else tt.remove();
      const items = (P.items || []).slice(0, 3).map((x) => (typeof x === 'string' ? { title: x } : x));
      const t0 = P.title ? D(0.35) : D(0.05), st = D(+P.stagger || 0.22);
      items.forEach((it, i) => {
        const cd = C.el('div', 'cd glass', grid), md = C.el('div', 'md', cd), img = P['image_' + (i + 1)], ic = P['icon_' + (i + 1)];
        if (img) { const ph = C.el('div', 'ph', md); ph.style.backgroundImage = `url("${img}")`; }
        else { md.classList.add('small'); if (ic) C.icon(md, ic); else md.textContent = String(i + 1); }
        const tx = C.el('div', 'tx', cd); C.el('b', '', tx, C.plain(it.title || '')); if (it.text) C.el('small', '', tx, C.plain(it.text));
        cd.dataset.text = [C.plain(it.title || ''), C.plain(it.text || '')].filter(Boolean).join(' ');
        cards.push({ cd, md, at: t0 + i * st });
      });
      // shrink the cards' type until the whole block fits the safe zone
      const root = document.getElementById('root'), room = root.clientHeight * 0.98 - (tt.isConnected ? tt.offsetHeight : 0) - 4.5 * ctx.u;
      if (grid.offsetHeight > room) grid.style.zoom = Math.max(0.5, room / grid.offsetHeight).toFixed(4);
      hi = Math.round(+P.highlight || 0) - 1;
      tl = C.timeline().at('tt', 0, D(0.6)).at('hi', t0 + items.length * st + D(0.55), D(0.6));
    },
    seek(t, P, ctx) {
      const u = ctx.u, ex = C.exitP(t), land = ctx.w > ctx.h;
      if (tt.isConnected) tt.querySelectorAll('.wi').forEach((wi, i) => { C.rise(wi, t, i * D(0.04), D(0.6), wi.offsetHeight); if (ex) C.set(wi, { o: 1 - ex }); });
      const ph = hi >= 0 && hi < cards.length ? tl.p('hi', t, C.MOVE) : 0;
      cards.forEach((x, i) => {
        const p = C.prog(t, x.at, D(0.7)), e = C.IN(p), f = (tt0) => (1 - C.IN(C.prog(tt0, x.at, D(0.7)))) * 6 * u;
        const me = i === hi, lift = me ? ph : 0, back = hi >= 0 && !me ? ph : 0;
        C.set(x.cd, { y: f(t) - lift * 1.6 * u - ex * 2 * u, s: (0.94 + 0.06 * e) * (1 + 0.035 * lift - 0.02 * back),
                      o: Math.min(1, p * 2.4) * (1 - 0.25 * back) * (1 - ex), blur: C.mblur(f, t) });
        x.cd.style.setProperty('--lit', (0.8 * lift).toFixed(3)); x.cd.style.zIndex = me ? 2 : 1;
        C.set(x.md, { s: 0.9 + 0.1 * C.IN(C.prog(t, x.at + D(0.1), D(0.6))) });
      });
      void land;
    },
    cues() { cards.forEach((x, i) => C.cue(x.at, 'card', -18, { pitch: [0, 0.6, 1.2][i] })); if (hi >= 0 && hi < cards.length) C.cue(tl.t0('hi'), 'pop', -22, { pitch: 3 }); },
  });
})();
</script>
