<div class="eyebrow bare" id="eb"></div>
<div id="wrap"><div id="card"><div id="grid"></div></div></div>
<style>
  #eb { position: absolute; left: 0; right: 0; justify-content: center; color: var(--text); font-size: calc(var(--u) * 2.8); letter-spacing: 0.32em; }
  #wrap { position: absolute; left: calc(var(--u) * 4.6); right: calc(var(--u) * 4.6); perspective: calc(var(--u) * 150); }
  #card { transform-origin: 50% 0; border-radius: calc(var(--u) * 3.6); padding: calc(var(--u) * 2.6);
          background: linear-gradient(170deg, rgb(var(--card-rgb) / 0.94), rgb(var(--card-rgb) / 0.86));
          border: calc(var(--u) * 0.3) solid rgb(var(--card-border-rgb) / 1); box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 9) rgb(0 0 0 / 0.5); }
  #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: calc(var(--u) * 1.3); }
  .slot { aspect-ratio: 1; perspective: calc(var(--u) * 60); }
  .cell { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; border-radius: calc(var(--u) * 1.6); backface-visibility: hidden; display: flex;
          align-items: flex-end; justify-content: flex-end; padding: calc(var(--u) * 0.9); font-size: calc(var(--u) * 2.1);
          font-weight: 600; color: var(--muted); background: rgb(var(--surface-rgb) / 1); }
  .back { transform: rotateY(180deg); align-items: center; justify-content: center; padding: 0; color: var(--text);
          background: linear-gradient(155deg, rgb(var(--accent-rgb) / 0.55), rgb(var(--accent-dark-rgb) / 0.8));
          border: calc(var(--u) * 0.28) solid rgb(var(--accent-rgb) / 0.95); box-shadow: 0 0 calc(var(--u) * 2.4) rgb(var(--accent-rgb) / 0.5); }
  .back svg { width: 56%; height: 56%; }
</style>
<script>
(() => {
  const C = CVES, D = C.D; let eb, card, W = null, cells = [], booked = [];
  C.piece({
    setup(P, ctx) {
      eb = document.getElementById('eb'); card = document.getElementById('card');
      document.getElementById('wrap').style.top = (P.top || 335) + 'px';
      if (P.eyebrow) { W = C.words(eb, C.plain(P.eyebrow)); eb.style.top = ((P.eyebrow_y || 300) - eb.offsetHeight * 0.8) + 'px'; } else eb.remove();
      const g = document.getElementById('grid');
      for (let i = 0; i < 35; i++) {
        const s = C.el('div', 'slot', g), c = C.el('div', 'cell', s);
        C.el('div', 'face', c, String(i + 1)); const b = C.el('div', 'face back', c);
        cells.push({ s, c, r: Math.floor(i / 7), k: i % 7, path: C.svg(b, C.CHECK).querySelector('path') });
      }
      const rnd = C.rand(P.seed || 7), idx = [...Array(35).keys()];
      for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      booked = idx.slice(0, Math.min(35, P.booked || 16)).sort((a, b) => a - b).map((i) => cells[i]);
    },
    seek(t, P, ctx) {
      const u = ctx.u, ex = C.exitP(t), pc = C.prog(t, 0, D(0.55)), e = C.IN(pc);
      const push = 1 + 0.03 * C.prog(t, D(0.55), Math.max(0.1, ctx.dur - D(0.55)));
      card.style.transform = `translate3d(0, ${((1 - e) * 10 * u + ex * 6 * u).toFixed(2)}px, 0) rotateX(${(30 * (1 - e) + 6).toFixed(2)}deg) scale(${push.toFixed(4)})`;
      card.style.opacity = (Math.min(1, pc * 3.2) * (1 - ex)).toFixed(3);
      cells.forEach((o) => {
        const d0 = D(0.08) + (o.r + o.k) * D(0.022), p = C.prog(t, d0, D(0.3)), ee = C.IN(p);
        C.set(o.s, { s: 1.3 - 0.3 * ee, o: Math.min(1, p * 2.6), blur: (1 - ee) * 0.7 * u });
      });
      const f0 = P.fill_at ?? D(0.6), st = P.stagger || 0.04;
      booked.forEach((o, j) => {
        const t0 = f0 + j * st, p = C.prog(t, t0, D(0.34));
        o.c.style.transform = `rotateY(${(180 * C.IN(p)).toFixed(2)}deg) scale(${(1 + 0.16 * Math.sin(Math.PI * p)).toFixed(4)})`;
        C.draw(o.path, C.prog(t, t0 + D(0.16), D(0.2)));
      });
      if (W) { W.inners.forEach((wi, i) => C.rise(wi, t, (P.eyebrow_at ?? 0) + i * D(0.06), D(0.4), 1.8 * u)); eb.style.opacity = (1 - ex).toFixed(3); }
    },
    cues(P) {
      const f0 = P.fill_at ?? D(0.6), st = P.stagger || 0.04;
      C.cue(0, 'swipe', -13);
      if (P.eyebrow) C.cue(P.eyebrow_at ?? 0, 'whoosh_soft', -19);
      C.cue(f0, 'pop', -15, { pitch: 2 }); C.cue(f0 + 4 * st, 'pop', -16, { pitch: 4 }); C.cue(f0 + 9 * st, 'ui_tick', -17); C.cue(f0 + 14 * st, 'pop', -17, { pitch: 6 });
    },
  });
})();
</script>
