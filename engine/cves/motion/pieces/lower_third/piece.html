<div class="safe" id="zone">
  <div class="lt" id="lt">
    <div class="bar" id="bar"></div>
    <div class="plate" id="plate" data-el="plate">
      <div class="nm" id="nm"></div>
      <div class="rl" id="rl"></div>
    </div>
  </div>
</div>
<style>
  #zone { display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; padding-bottom: var(--s-3); }
  #zone.top { justify-content: flex-start; padding: var(--s-3) 0 0; }
  #zone.c { align-items: center; }
  .lt { display: flex; align-items: stretch; max-width: 100%; }
  .bar { width: calc(var(--u) * 1.1); border-radius: 99px; background: var(--accent); transform-origin: center bottom; margin-right: calc(var(--u) * 1.2);
         box-shadow: 0 0 calc(var(--u) * 2) rgb(var(--accent-rgb) / 0.55); }
  .plate { background: rgb(var(--card-rgb) / 0.9); border-radius: var(--r-s); padding: calc(var(--u) * 2.2) calc(var(--u) * 3.6) calc(var(--u) * 2.4);
           box-shadow: 0 calc(var(--u) * 1.6) calc(var(--u) * 5) rgb(0 0 0 / 0.4); border: max(1px, calc(var(--u) * 0.12)) solid rgb(var(--text-rgb) / 0.08);
           min-width: 0; overflow: hidden; }
  .nm { font-size: var(--t-5); font-weight: 800; letter-spacing: -0.015em; line-height: 1.05; white-space: nowrap; }
  .rl { font-size: var(--t-2); font-weight: 600; color: var(--muted); margin-top: 0.45em; letter-spacing: 0.06em; white-space: nowrap; }
</style>
<script>
(() => {
  const C = CVES, D = C.D; let bar, plate, nm, rl, lt, tl;
  C.piece({
    setup(P, ctx) {
      const zone = document.getElementById('zone'); lt = document.getElementById('lt');
      bar = document.getElementById('bar'); plate = document.getElementById('plate'); nm = document.getElementById('nm'); rl = document.getElementById('rl');
      if (P.position === 'top') zone.classList.add('top'); if (P.align === 'center') zone.classList.add('c');
      nm.textContent = C.plain(P.name); nm.dataset.text = nm.textContent;
      if (P.role) { rl.textContent = C.plain(P.role); rl.dataset.text = rl.textContent; } else rl.remove();
      const maxW = zone.clientWidth - ctx.u * 2.3 - ctx.u * 7.4;
      C.fit(nm, maxW, ctx.h, 1, 0.5); if (rl.isConnected) C.fit(rl, maxW, ctx.h, 1, 0.5);
      tl = C.timeline().at('bar', 0, D(0.42)).at('plate', D(0.2), D(0.62)).at('nm', D(0.36), D(0.6)).at('rl', D(0.55), D(0.7));
    },
    seek(t, P, ctx) {
      const u = ctx.u, ex = C.exitP(t, Math.max(0.38, C.motion.exit_s));
      bar.style.transform = `scaleY(${(tl.p('bar', t, 'outBack') * (1 - C.easings.inCubic(C.prog(ex, 0.55, 0.45)))).toFixed(4)})`;
      bar.style.opacity = Math.min(1, tl.raw('bar', t) * 4).toFixed(3);
      const open = tl.p('plate', t, C.MOVE) * (1 - ex);
      plate.style.clipPath = `inset(0 ${((1 - open) * 100).toFixed(3)}% 0 0 round var(--r-s))`;
      C.rise(nm, t, tl.t0('nm'), D(0.6), nm.offsetHeight * 0.9);
      if (rl.isConnected) {
        const p = tl.p('rl', t); C.set(rl, { x: (1 - p) * -2 * u, o: Math.min(1, tl.raw('rl', t) * 2) });
        rl.style.letterSpacing = `${(0.06 + 0.14 * (1 - p)).toFixed(4)}em`;
      }
      if (ex) C.set(nm, { o: 1 - ex });
    },
    cues() { C.cue(tl.t0('plate'), 'swipe', -22, { trim: [0, 0.3] }); },     // on the plate's entry; it leaves silently (no logged entry to land on)
  });
})();
</script>
