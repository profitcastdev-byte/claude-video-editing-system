<div class="safe center" id="root">
  <div class="cm solid" id="cm">
    <div class="av" id="av" data-el="avatar"></div>
    <div class="bd">
      <div class="hd" id="hd"><b id="hn"></b><span class="vf" id="vf"></span><span class="tm" id="tm"></span></div>
      <p class="tx" id="tx"></p>
      <div class="ft" id="ft" data-el="likes"><span class="hr" id="hr"></span><span class="lk num" id="lk"></span><span class="rp">Reply</span></div>
    </div>
  </div>
</div>
<style>
  #root.low { justify-content: flex-end; padding-bottom: 8%; }
  .cm { display: flex; gap: calc(var(--u) * 3); align-items: flex-start; width: min(100%, calc(var(--u) * 84)); padding: calc(var(--u) * 3.6) calc(var(--u) * 4.2);
        border-radius: calc(var(--r) * 1.3); text-align: left; transform-origin: 8% 0%; font-size: var(--t-4); }
  .av { width: 2.4em; height: 2.4em; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.95em; color: var(--bg);
        background: linear-gradient(140deg, var(--accent), var(--accent-dark)); background-size: cover; background-position: center;
        box-shadow: 0 0 0 calc(var(--u) * 0.5) rgb(var(--card-rgb) / 1), 0 0 0 calc(var(--u) * 0.85) rgb(var(--accent-rgb) / 0.55); }
  .bd { display: flex; flex-direction: column; gap: calc(var(--u) * 1.3); min-width: 0; flex: 1; }
  .hd { display: flex; align-items: center; gap: 0.35em; font-size: 0.72em; line-height: 1; }
  .hd b { font-weight: 700; color: var(--text); }
  .vf { width: 1em; height: 1em; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-items: center; flex: none; }
  .vf svg { width: 80%; height: 80%; }
  .tm { color: var(--muted); font-weight: 500; }
  .tx { font-weight: 600; line-height: 1.22; color: var(--text); text-wrap: pretty; }
  .ft { display: flex; align-items: center; gap: 0.45em; font-size: 0.66em; color: var(--muted); margin-top: calc(var(--u) * 0.4); }
  .hr { width: 1.25em; height: 1.25em; position: relative; }
  .hr svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hr .o path { fill: none; stroke: var(--muted); stroke-width: 7; }
  .hr .f path { fill: var(--negative); }
  .lk { font-weight: 700; font-size: 1.05em; letter-spacing: -0.01em; color: var(--text); min-width: 3.2em; }
  .rp { font-weight: 600; margin-left: 0.6em; }
  @media (min-aspect-ratio: 1/1) { .cm { width: min(100%, calc(var(--u) * 92)); } .tx { text-wrap: balance; } }
</style>
<script>
(() => {
  const C = CVES, D = C.D;
  const HEART = '<path d="M50 86 C20 64 8 48 8 32 C8 18 19 9 31 9 C40 9 46 14 50 21 C54 14 60 9 69 9 C81 9 92 18 92 32 C92 48 80 64 50 86 Z" stroke-linejoin="round"/>';
  let root, cm, av, hd, tx, ft, hr, hf, lk, W, tl, likes;
  C.piece({
    setup(P, ctx) {
      root = document.getElementById('root'); cm = document.getElementById('cm'); av = document.getElementById('av'); hd = document.getElementById('hd');
      tx = document.getElementById('tx'); ft = document.getElementById('ft'); hr = document.getElementById('hr'); lk = document.getElementById('lk');
      if (P.position === 'low') root.classList.add('low');
      const handle = C.plain(P.handle);
      document.getElementById('hn').textContent = handle;
      if (P.verified) C.svg(document.getElementById('vf'), C.CHECK); else document.getElementById('vf').remove();
      document.getElementById('tm').textContent = P.time ? '· ' + C.plain(P.time) : '';
      hd.dataset.text = handle + (P.time ? ' · ' + C.plain(P.time) : '');
      if (P.avatar) av.style.backgroundImage = `url("${P.avatar}")`; else av.textContent = (handle.replace(/^@/, '')[0] || '?').toUpperCase();
      W = C.words(tx, P.text);
      likes = Math.max(0, Math.round(+P.likes || 0));
      C.svg(hr, HEART, '0 0 100 100', 'o'); hf = C.svg(hr, HEART, '0 0 100 100', 'f');
      if (likes) lk.textContent = C.fmt(likes); else { lk.remove(); hr.remove(); }
      const fitH = (ctx.h * (ctx.w > ctx.h ? 0.62 : 0.4)); let fs = parseFloat(getComputedStyle(cm).fontSize);
      for (let n = 0; n < 30 && cm.getBoundingClientRect().height > fitH; n++) { fs *= 0.94; cm.style.fontSize = fs + 'px'; }
      const n = W.words.length, each = D(Math.min(0.045, 0.9 / Math.max(1, n)));
      tl = C.timeline().at('cm', 0, D(0.55)).at('hd', D(0.18), D(0.5)).at('tx', D(0.28), D(0.55) + each * (n - 1)).at('heart', tl0(), D(0.5)).at('count', tl0() + D(0.05), D(0.9));
      function tl0() { return D(0.28) + D(0.55) + each * (n - 1) + D(0.1); }
      tl.each = each;
    },
    seek(t, P, ctx) {
      const u = ctx.u, ex = C.exitP(t), pc = tl.p('cm', t, 'spring(0.7)'), rc = tl.raw('cm', t);
      C.set(cm, { y: (1 - pc) * 5 * u + ex * 3 * u, s: 0.86 + 0.14 * pc, o: Math.min(1, rc * 3) * (1 - ex) });
      C.set(av, { s: 0.6 + 0.4 * tl.p('cm', t, 'spring(0.55)') });
      C.rise(hd, t, tl.t0('hd'), D(0.5), 1.4 * u, { axis: 'x' });
      W.inners.forEach((wi, i) => C.rise(wi, t, tl.t0('tx') + i * tl.each, D(0.55), 0.6 * wi.offsetHeight));
      C.set(ft, { o: Math.min(1, tl.raw('heart', t) * 3) });
      if (likes) {
        const ph = tl.raw('heart', t);
        C.set(hf, { s: ph <= 0 ? 0 : C.easings.outBack(ph, 2.4), o: ph > 0 ? 1 : 0 });
        const pk = C.easings.outExpo(tl.raw('count', t));
        lk.textContent = C.fmt(Math.round(likes * (0.82 + 0.18 * pk)));
      }
    },
    cues(P) {
      C.cue(0, 'pop', -18, { pitch: 2 });
      if (likes) C.cue(tl.t0('heart'), 'pop', -16, { pitch: 5 });
    },
  });
})();
</script>
