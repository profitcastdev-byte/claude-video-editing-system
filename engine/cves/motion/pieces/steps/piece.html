<div class="safe center">
  <div class="st" id="st">
    <h2 class="title" id="tt"></h2>
    <div class="track" id="track"><div class="line" id="line"><div class="lf" id="lf"></div></div></div>
  </div>
</div>
<style>
  .st { width: min(100%, calc(var(--u) * 84)); text-align: left; font-size: var(--t-4); }
  #tt { font-size: var(--t-5); margin-bottom: var(--s-4); }
  .track { position: relative; display: flex; flex-direction: column; gap: calc(var(--u) * 5); }
  .line { position: absolute; left: calc(var(--u) * 3.6); top: calc(var(--u) * 3.6); bottom: calc(var(--u) * 3.6); width: calc(var(--u) * 0.5); margin-left: calc(var(--u) * -0.25);
          background: rgb(var(--text-rgb) / 0.14); border-radius: 99px; }
  .lf { position: absolute; inset: 0; background: var(--accent); border-radius: 99px; transform-origin: top center; box-shadow: 0 0 calc(var(--u) * 1.6) rgb(var(--accent-rgb) / 0.6); }
  .step { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 3); }
  .node { width: calc(var(--u) * 7.2); height: calc(var(--u) * 7.2); border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: var(--t-3);
          background: var(--card); border: calc(var(--u) * 0.45) solid rgb(var(--text-rgb) / 0.25); color: var(--muted); z-index: 1; }
  .node.on { background: var(--accent); border-color: var(--text); color: var(--bg); box-shadow: 0 0 0 calc(var(--u) * 1) rgb(var(--accent-rgb) / 0.25), 0 0 calc(var(--u) * 3) rgb(var(--accent-rgb) / 0.6); }
  .lab { display: flex; flex-direction: column; gap: 0.2em; }
  .lab b { font-weight: 700; line-height: 1.1; }
  .lab small { font-size: 0.6em; font-weight: 500; color: var(--muted); }
  @media (min-aspect-ratio: 1/1) {
    .st { width: min(100%, calc(var(--u) * 160)); }
    .track { flex-direction: row; gap: 0; justify-content: space-between; }
    .step { flex-direction: column; align-items: center; text-align: center; flex: 1; gap: calc(var(--u) * 2.4); }
    .lab { align-items: center; }
    .line { left: 0; right: 0; top: calc(var(--u) * 3.6); bottom: auto; height: calc(var(--u) * 0.5); width: auto; margin: calc(var(--u) * -0.25) 0 0; }
    .lf { transform-origin: left center; }
  }
</style>
<script>
(() => {
  const C = CVES, D = C.D; let tt, line, lf, steps = [], tl, land;
  C.piece({
    setup(P, ctx) {
      tt = document.getElementById('tt'); line = document.getElementById('line'); lf = document.getElementById('lf'); land = ctx.w > ctx.h;
      if (P.title) C.words(tt, P.title); else tt.remove();
      const track = document.getElementById('track'), list = (P.steps || []).map((x) => (typeof x === 'string' ? { text: x } : x));
      const t0 = P.title ? D(0.45) : D(0.1), st = D(P.stagger || 0.55);
      list.forEach((s, i) => {
        const el = C.el('div', 'step', track); const node = C.el('div', 'node', el, String(i + 1)); const lab = C.el('div', 'lab', el);
        C.el('b', '', lab, C.plain(s.text)); if (s.sub) C.el('small', '', lab, C.plain(s.sub)); el.dataset.text = C.plain(s.text) + (s.sub ? ' ' + C.plain(s.sub) : '');
        steps.push({ el, node, lab, at: typeof s.at === 'number' ? s.at : t0 + i * st });
      });
      // line geometry: from the first node's centre to the last one's
      const a = steps[0].node, b = steps[steps.length - 1].node, tr = track.getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      if (land) { line.style.left = (ra.left + ra.width / 2 - tr.left) + 'px'; line.style.right = (tr.right - rb.left - rb.width / 2) + 'px'; }
      else { line.style.top = (ra.top + ra.height / 2 - tr.top) + 'px'; line.style.bottom = (tr.bottom - rb.top - rb.height / 2) + 'px'; }
      tl = C.timeline().at('tt', 0, D(0.6));
    },
    seek(t, P, ctx) {
      const u = ctx.u, ex = C.exitP(t), n = steps.length;
      if (tt.isConnected) tt.querySelectorAll('.wi').forEach((wi, i) => C.rise(wi, t, i * D(0.04), D(0.6), wi.offsetHeight));
      // the line reaches node i at steps[i].at (piecewise, eased between nodes)
      let f = 0;
      for (let i = 0; i < n - 1; i++) f += C.easings.inOutCubic(C.prog(t, steps[i].at + D(0.15), Math.max(0.05, steps[i + 1].at - steps[i].at))) / Math.max(1, n - 1);
      lf.style.transform = land ? `scaleX(${f.toFixed(4)})` : `scaleY(${f.toFixed(4)})`;
      C.set(line, { o: Math.min(1, C.prog(t, steps[0].at, D(0.3)) * 2) * (1 - ex) });
      steps.forEach((s, i) => {
        const pn = C.prog(t, s.at, D(0.45)); s.node.classList.toggle('on', t >= s.at + D(0.12));
        C.set(s.node, { s: 0.5 + 0.5 * C.easings.outBack(pn), o: Math.min(1, pn * 3) * (1 - ex) });
        const pl = C.prog(t, s.at + D(0.1), D(0.6)); C.set(s.lab, { x: land ? 0 : (1 - C.IN(pl)) * 3 * u, y: land ? (1 - C.IN(pl)) * 2 * u : 0, o: Math.min(1, pl * 2) * (1 - ex) });
      });
      if (ex && tt.isConnected) C.set(tt, { o: 1 - ex });
    },
    cues() { steps.forEach((s, i) => C.cue(s.at + D(0.12), 'pop', -19, { pitch: i * 1.2 })); },
  });
})();
</script>
