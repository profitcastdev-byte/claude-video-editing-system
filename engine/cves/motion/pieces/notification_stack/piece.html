<div class="safe" id="root"><div class="stk" id="stk"></div></div>
<style>
  #root { display: flex; justify-content: center; align-items: flex-start; }
  #root.mid { align-items: center; }
  .stk { position: relative; width: min(100%, calc(var(--u) * 86)); margin-top: calc(var(--u) * 2); font-size: var(--t-3); }
  .nb { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: calc(var(--u) * 2.6); padding: calc(var(--u) * 2.6) calc(var(--u) * 3);
        border-radius: calc(var(--r) * 1.25); transform-origin: 50% 0%; text-align: left; }
  .nb.glass { background: linear-gradient(165deg, rgb(var(--text-rgb) / 0.14), rgb(var(--text-rgb) / 0.05)), rgb(var(--card-rgb) / 0.9); }
  .iw { width: 2.4em; height: 2.4em; flex: none; border-radius: 26%; display: grid; place-items: center; color: var(--bg); font-weight: 800;
        background: linear-gradient(150deg, var(--accent), var(--accent-dark)); box-shadow: inset 0 max(1px, calc(var(--u) * 0.12)) 0 rgb(var(--text-rgb) / 0.3); }
  .iw .ic { width: 58%; height: 58%; }
  .tx { display: flex; flex-direction: column; gap: 0.18em; min-width: 0; flex: 1; }
  .top { display: flex; justify-content: space-between; gap: 1em; font-size: 0.7em; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .top i { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .tx b { font-weight: 700; line-height: 1.15; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx span.bo { font-weight: 500; line-height: 1.25; color: rgb(var(--text-rgb) / 0.78); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (min-aspect-ratio: 1/1) { .stk { width: min(100%, calc(var(--u) * 70)); font-size: var(--t-2); } }
</style>
<script>
(() => {
  const C = CVES, D = C.D; let stk, bans = [], H = 0;
  C.piece({
    setup(P, ctx) {
      const root = document.getElementById('root'); stk = document.getElementById('stk');
      if (P.position === 'center') root.classList.add('mid');
      const items = (P.items || []).map((x) => (typeof x === 'string' ? { title: x } : x)), st = D(P.stagger || 0.75);
      items.forEach((it, i) => {
        const b = C.el('div', 'nb glass', stk), iw = C.el('div', 'iw', b);
        if (it.icon && /^(file|data|https?):/.test(String(it.icon))) C.icon(iw, it.icon); else iw.textContent = (C.plain(it.app || it.title || '?')[0] || '?').toUpperCase();
        const tx = C.el('div', 'tx', b), top = C.el('div', 'top', tx);
        C.el('span', '', top, C.plain(it.app || '')); C.el('i', '', top, C.plain(P.time || ''));
        if (it.title) C.el('b', '', tx, C.plain(it.title)); if (it.body) C.el('span', 'bo', tx, C.plain(it.body));
        tx.dataset.text = [it.app, it.title, it.body].filter(Boolean).map(C.plain).join(' ');
        b.style.zIndex = String(10 + i);
        bans.push({ b, at: typeof it.at === 'number' ? it.at : D(0.05) + i * st });
      });
      H = Math.max(...bans.map((x) => x.b.offsetHeight), 1); stk.style.height = H + 'px';
    },
    seek(t, P, ctx) {
      const u = ctx.u, ex = C.exitP(t);
      bans.forEach((x, i) => {
        const p = C.prog(t, x.at, D(0.55)), pe = C.easings.spring(0.78)(p);
        // how far this banner has been pushed back by the newer ones that have landed
        let k = 0; for (let j = i + 1; j < bans.length; j++) k += C.MOVE(C.prog(t, bans[j].at, D(0.5)));
        const depth = Math.min(k, 3.2);
        const y = -(1 - pe) * (H + 4 * u) + depth * 3.6 * u - ex * 4 * u;
        const o = (p <= 0 ? 0 : Math.min(1, p * 3)) * Math.max(0, 1 - Math.max(0, depth - 2) ) * (1 - 0.18 * Math.min(depth, 2)) * (1 - ex);
        C.set(x.b, { y, s: 1 - 0.06 * depth, o, blur: depth > 0.05 ? Math.min(0.5, depth * 0.2) * u : (1 - pe) * 0.6 * u });
        // older banners hide their copy as they tuck in, so only the edge peeks out
        x.b.querySelector('.tx').style.opacity = (1 - C.clamp(depth)).toFixed(3);
        x.b.querySelector('.iw').style.opacity = (1 - C.clamp(depth)).toFixed(3);
      });
    },
    cues() { bans.forEach((x, i) => C.cue(x.at, 'ding', -22, { pitch: i * 0.7 })); },
  });
})();
</script>
