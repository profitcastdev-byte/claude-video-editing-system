<div id="blk"><div class="eyebrow bare" id="eb"></div><div id="rows"></div>
  <i class="br a"></i><i class="br b"></i><i class="br c"></i><i class="br d"></i></div>
<style>
  #blk { position: absolute; left: calc(var(--u) * 10); right: calc(var(--u) * 10); }
  #eb { display: flex; justify-content: center; margin-bottom: calc(var(--u) * 4); font-size: calc(var(--u) * 2.5); letter-spacing: 0.26em; }
  .row { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 2.2); height: calc(var(--u) * 12.6);
         padding: 0 calc(var(--u) * 2); margin-bottom: calc(var(--u) * 2.8); border-radius: calc(var(--u) * 2.4); }
  .lit { position: absolute; inset: 0; border-radius: inherit; border: calc(var(--u) * 0.35) solid var(--accent);
         box-shadow: 0 0 calc(var(--u) * 3) rgb(var(--accent-rgb) / 0.35), inset 0 0 calc(var(--u) * 2) rgb(var(--accent-rgb) / 0.12); opacity: 0; }
  .well { width: calc(var(--u) * 8.6); height: calc(var(--u) * 8.6); flex: none; border-radius: calc(var(--u) * 1.8); background: var(--icon-well);
          display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: calc(var(--u) * 4.4); }
  .numw { overflow: clip; overflow-clip-margin: 0.1em; flex: none; }
  .num { display: inline-block; font-size: calc(var(--u) * 6.2); color: var(--accent); }
  .lab { flex: 1; font-size: calc(var(--u) * 2.9); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
  .mk { position: relative; width: calc(var(--u) * 5.6); height: calc(var(--u) * 5.6); flex: none; border-radius: 50%; background: var(--accent);
        color: var(--card); display: flex; align-items: center; justify-content: center; }
  .mk svg { width: 72%; height: 72%; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: calc(var(--u) * 0.35) solid var(--accent); }
  .br { position: absolute; width: calc(var(--u) * 6); height: calc(var(--u) * 6); border: 0 solid var(--line); }
  .br.a { left: calc(var(--u) * -4); top: calc(var(--u) * -4); border-left-width: calc(var(--u) * .35); border-top-width: calc(var(--u) * .35); }
  .br.b { right: calc(var(--u) * -4); top: calc(var(--u) * -4); border-right-width: calc(var(--u) * .35); border-top-width: calc(var(--u) * .35); }
  .br.c { left: calc(var(--u) * -4); bottom: calc(var(--u) * -1.2); border-left-width: calc(var(--u) * .35); border-bottom-width: calc(var(--u) * .35); }
  .br.d { right: calc(var(--u) * -4); bottom: calc(var(--u) * -1.2); border-right-width: calc(var(--u) * .35); border-bottom-width: calc(var(--u) * .35); }
</style>
<script>
(() => {
  const C = CVES, D = C.D; let blk, eb, W = null, R = [], brs;
  C.piece({
    setup(P, ctx) {
      blk = document.getElementById('blk'); eb = document.getElementById('eb'); blk.style.top = (P.y || 600) + 'px';
      if (P.eyebrow) W = C.words(eb, C.plain(P.eyebrow)); else eb.style.visibility = 'hidden';
      const rows = document.getElementById('rows');
      (P.items || []).forEach((it, i) => {
        const r = C.el('div', 'row solid', rows); const lit = C.el('div', 'lit', r); const sh = C.el('div', 'sheen', r);
        const w = C.el('div', 'well', r); C.icon(w, P.icon || null);
        const nw = C.el('div', 'numw', r); const n = C.el('span', 'num', nw, C.plain(String(it.num || ''))); n.dataset.text = n.textContent;
        const l = C.el('div', 'lab', r, C.plain(it.text || '')); l.dataset.text = l.textContent;
        const mk = C.el('div', 'mk', r); const ring = C.el('i', 'ring', mk); const path = C.svg(mk, C.CHECK).querySelector('path');
        R.push({ r, lit, sh, n, l, mk, ring, path, at: it.at ?? i * 0.5, m: it.mark_at ?? (it.at ?? i * 0.5) + 0.5 });
      });
      R.forEach((o) => C.fit(o.l, o.l.clientWidth, o.l.clientHeight * 1.6, 1, 0.6));
      brs = [...document.querySelectorAll('.br')];
    },
    seek(t, P, ctx) {
      const u = ctx.u;
      C.set(blk, { y: -1.4 * u * C.prog(t, 0, ctx.dur) });
      if (W) W.inners.forEach((wi, i) => C.rise(wi, t, (P.eyebrow_at ?? 0) + i * D(0.05), D(0.4), 1.8 * u));
      const pb = C.IN(C.prog(t, P.eyebrow_at ?? 0, D(0.45)));
      brs.forEach((b, i) => C.set(b, { x: (i % 2 ? 1 : -1) * 3 * u * (1 - pb), y: (i < 2 ? -1 : 1) * 3 * u * (1 - pb), o: pb }));
      R.forEach((o) => {
        const f = (tt) => -10 * u * (1 - C.IN(C.prog(tt, o.at, D(0.4)))), p = C.prog(t, o.at, D(0.4));
        C.set(o.r, { x: f(t), s: 1.04 - 0.04 * C.IN(p), o: Math.min(1, p * 2.6), blur: C.mblur(f, t) });
        C.rise(o.n, t, o.at + D(0.06), D(0.42), o.n.offsetHeight * 1.05, { fade: 4 });
        C.rise(o.l, t, o.at + D(0.1), D(0.4), 3 * u, { axis: 'x' });
        const pm = C.prog(t, o.m, D(0.3));
        C.set(o.mk, { s: pm <= 0 ? 0.001 : 1.8 - 0.8 * C.IN(pm), o: Math.min(1, pm * 3) });
        C.draw(o.path, C.prog(t, o.m + D(0.08), D(0.22)));
        const pr = C.prog(t, o.m, D(0.5)); C.set(o.ring, { s: 1 + 1.3 * C.IN(pr), o: pr > 0 && pr < 1 ? 0.8 * (1 - pr) : 0 });
        o.lit.style.opacity = (C.prog(t, o.m, D(0.12)) * (1 - 0.45 * C.prog(t, o.m + D(0.15), D(0.5)))).toFixed(3);
        o.sh.style.setProperty('--sheen-x', (-140 + 480 * C.MOVE(C.prog(t, o.m, D(0.6)))).toFixed(1) + '%');
      });
    },
    cues(P) {
      if (P.eyebrow) C.cue(P.eyebrow_at ?? 0, 'swipe', -16, { trim: [0, 0.25] });
      (P.items || []).forEach((it, i) => { C.cue(it.at ?? i * 0.5, 'card', -11, { pitch: [0, 0.5, -0.5][i % 3] }); C.cue(it.mark_at ?? (it.at ?? i * 0.5) + 0.5, 'pop', -12, { pitch: 2 + i * 0.6 }); });
    },
  });
})();
</script>
