# The legacy-cutaway demo edit (tools/make_demo.py --edit legacy): the v0.2 UI cutaways and roto cards, which lay out per
# canvas shape (docs/FORMATS.md). Build it at 1080x1920, 1920x1080 and 3840x2160 to see the three arrangements.
# "{start:<clip>+0.3}" / "{end:<clip>}" resolve to cut times of that clip's segment (the full script: no --small).
cutaways:
  - id: c1
    template: card_list
    start: "{start:02_problem+0.2}"
    end: "{end:02_problem}"
    params:
      label: "WHY PEOPLE SWIPE"
      label_at: "{start:02_problem+0.2}"
      items:
        - {icon: event, title: "Long intros", at: "{start:02_problem+0.35}", state: cross}
        - {icon: call, title: "Slow cuts", at: "{start:02_problem+0.9}", state: cross}
        - {icon: search, title: "Tiny text", sub: "unreadable on a phone", at: "{start:02_problem+1.5}", state: cross}
  - id: c2
    template: stat
    start: "{start:03_proof+0.7}"
    snap: false                       # the presenter shows first: a face between the cutaways (RET-22)
    end: "{end:03_proof}"
    params:
      value: 90
      suffix: "%"
      count: ["{start:03_proof+0.8}", 1.2]
      label: "KEEP WATCHING"
      label_at: "{start:03_proof+0.75}"
      unit: "of viewers stay"
      unit_at: "{start:03_proof+1.9}"
  - id: c3
    template: browser_list
    start: "{start:04_offer+0.6}"
    end: "{end:04_offer}"
    snap: false
    params:
      head: [["This", "{start:04_offer+0.6}"], ["engine", "{start:04_offer+0.8}"], ["edits", "{start:04_offer+1.0}", true]]
      enter: "{start:04_offer+0.6}"
      hero_at: "{start:04_offer+0.9}"
      rows:
        - {text: "Tight cuts", at: "{start:04_offer+1.1}", icon: event}
        - {text: "Readable captions", at: "{start:04_offer+1.35}", icon: chat}
        - {text: "Sound design", at: "{start:04_offer+1.6}", icon: star}
roto:
  - {segment: 01_hook_0, template: map_card, params: {at: "{start:01_hook+0.3}", pins: 4, pins_at: "{start:01_hook+0.9}"}}
  - {segment: 05_cta_0, template: big_words, params: {color: card, accent_color: "#123A8C",     # dark type: the drawn wall behind the head is light (GFX-15)
                                                      words: [["TRY", "{start:05_cta+0.3}"], ["IT", "{start:05_cta+0.55}"], ["TODAY", "{start:05_cta+0.8}", true]]}}
end_card:
  template: end_card
  duration: 2.0
  params: {headline: "Edit with CVES", button: "TRY THE DEMO", handle: "github.com/profitcastdev-byte/claude-video-editing-system", icon: link}
